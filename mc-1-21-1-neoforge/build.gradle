plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.143'
}

version = "${minecraft_version}-${mod_version}"
group = project.mod_group_id
base.archivesName = project.mod_id

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 共享纯 Java common 源码 + 共享 Cloth 界面 + 共享语言资源
sourceSets {
    main {
        java.srcDirs += ['../common', '../screen']
        resources.srcDirs += ['../resources']
    }
}

// toml 里的 ${file.jarVersion} 依赖 manifest 中的 Implementation-Version
jar {
    manifest {
        attributes 'Implementation-Version': project.version
    }
}

dependencies {
    implementation "me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_config_version}"
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
}
