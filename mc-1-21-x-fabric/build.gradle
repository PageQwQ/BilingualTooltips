buildscript {
    repositories {
        maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Gradle Plugin Portal'
            url = 'https://plugins.gradle.org/m2/'
        }
        gradlePluginPortal()
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:1.17.17"
    }
}

apply plugin: 'net.fabricmc.fabric-loom-remap'
apply plugin: 'java'

// 1.21.x 版本 → 依赖版本映射（fabric-api 表来自 memeChat 实测；cloth/modmenu 来自 Modrinth 2026-08 核实）
def fabricApiVersions = [
    '1.21.2':  '0.106.1+1.21.2',
    '1.21.3':  '0.114.1+1.21.3',
    '1.21.4':  '0.116.1+1.21.4',
    '1.21.5':  '0.128.2+1.21.5',
    '1.21.6':  '0.128.2+1.21.6',
    '1.21.7':  '0.129.0+1.21.7',
    '1.21.8':  '0.134.0+1.21.8',
    '1.21.9':  '0.134.1+1.21.9',
    '1.21.10': '0.137.0+1.21.10',
    '1.21.11': '0.141.1+1.21.11',
]
def clothConfigVersions = [
    '1.21.2':  '16.0.143',
    '1.21.3':  '16.0.143',
    '1.21.4':  '17.0.144',
    '1.21.5':  '18.0.145',
    '1.21.6':  '19.0.147',
    '1.21.7':  '19.0.147',
    '1.21.8':  '19.0.147',
    '1.21.9':  '20.0.149',
    '1.21.10': '20.0.149',
    '1.21.11': '21.11.153',
]
def modmenuVersions = [
    '1.21.2':  '12.0.1',
    '1.21.3':  '12.0.1',
    '1.21.4':  '13.0.4',
    '1.21.5':  '14.0.2',
    '1.21.6':  '15.0.1',
    '1.21.7':  '15.0.1',
    '1.21.8':  '15.0.1',
    '1.21.9':  '16.0.0',
    '1.21.10': '16.0.0',
    '1.21.11': '17.0.0',
]

def mcVersion = project.property('mc_version')
def fabricApiVersion = fabricApiVersions[mcVersion]
def clothConfigVersion = clothConfigVersions[mcVersion]
def modmenuVersion = modmenuVersions[mcVersion]
if (fabricApiVersion == null || clothConfigVersion == null || modmenuVersion == null) {
    throw new GradleException("未知版本: ${mcVersion}，支持: ${fabricApiVersions.keySet().join(', ')}")
}
// 按版本挂形态目录：Shift 检测 1.21.8 及之前静态、之后实例；资源定位类 1.21.11 起为 Identifier
def patch = Integer.parseInt(mcVersion.substring('1.21.'.length()))
def shiftForm = patch <= 8 ? 'shift-static' : 'shift-instance'
def resourceForm = patch <= 10 ? 'resource-rl' : 'resource-ident'

version = "${mcVersion}-${mod_version}-fabric"
group = project.maven_group
base.archivesName = project.archives_base_name

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}

loom {
    mods {
        bilingualtooltips {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://maven.aliyun.com/repository/central' }
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${clothConfigVersion}"
    modImplementation "com.terraformersmc:modmenu:${modmenuVersion}"
}

// 共享纯 Java common 源码 + 共享 Cloth 界面 + 共享语言资源 + 按版本挂形态目录
sourceSets {
    main {
        java.srcDirs += ['../common', '../screen']
        java.srcDirs += "src/${shiftForm}/java"
        java.srcDirs += "src/${resourceForm}/java"
        resources.srcDirs += ['../resources']
    }
}

processResources {
    def version = project.version
    inputs.property "version", version
    inputs.property "mcVersion", mcVersion
    filesMatching("fabric.mod.json") {
        expand "version": version, "mcVersion": mcVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}
