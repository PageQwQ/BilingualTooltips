buildscript {
    repositories {
        maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url = 'https://maven.aliyun.com/repository/public' }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Gradle Plugin Portal'
            url = 'https://plugins.gradle.org/m2/'
        }
        gradlePluginPortal()
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:1.17-SNAPSHOT"
    }
}

apply plugin: 'net.fabricmc.fabric-loom'
apply plugin: 'java'

version = "${minecraft_version}-${mod_version}-fabric"
group = project.maven_group
base.archivesName = project.archives_base_name

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

loom {
    mods {
        bilingualtooltips {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'https://maven.aliyun.com/repository/central' }
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
    // dev 运行时把 Cloth/ModMenu 作为真实模组加载（26.x 全 Mojang 映射，无需重映射）
    localRuntime "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
}

// 共享纯 Java common 源码 + 共享 Cloth 界面 + 共享语言资源
sourceSets {
    main {
        java.srcDirs += ['../common', '../screen']
        resources.srcDirs += ['../resources']
    }
}

processResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}
